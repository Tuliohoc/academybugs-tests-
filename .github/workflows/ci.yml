name: tests

on:
  push:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the Playwright suite
        # The planted bug fails on purpose. The suite's verdict is not the
        # pipeline's: the results are still written, and the gate below is
        # what decides whether this job is allowed to go green.
        continue-on-error: true
        run: npm run test:playwright

      - name: Fail only if it was not the planted bug
        run: node scripts/ci-gate.mjs

      - name: Render the Allure report
        if: always()
        run: npm run report:playwright

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-playwright
          path: reports/playwright
          retention-days: 30
          if-no-files-found: warn

      - name: Upload the raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-playwright
          path: allure-results
          retention-days: 7
          if-no-files-found: warn

  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run the Cypress suite
        run: npm run test:cypress

      - name: Render the Allure report
        if: always()
        run: npm run report:cypress

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-cypress
          path: reports/cypress
          retention-days: 30
          if-no-files-found: warn

      - name: Upload the raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-cypress
          path: allure-results-cypress
          retention-days: 7
          if-no-files-found: warn

  publish:
    # The suites can go red — a planted bug is a finding, not a broken pipeline
    # — so the site is published either way.
    needs: [playwright, cypress]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the Playwright report
        uses: actions/download-artifact@v4
        with:
          name: allure-playwright
          path: site/playwright

      - name: Download the Cypress report
        uses: actions/download-artifact@v4
        with:
          name: allure-cypress
          path: site/cypress

      - name: Download the raw results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: false

      # The numbers the lab draws are rewritten from this run, so the page can
      # never drift away from the report it embeds. If a job died before
      # writing results, the committed numbers stay.
      - name: Write the Test Lab numbers from this run
        run: |
          if [ -d results-playwright ] && [ -d results-cypress ]; then
            node scripts/lab-data.mjs results-playwright playwright pw.json
            node scripts/lab-data.mjs results-cypress cypress cy.json
            node scripts/sync-lab.mjs pw.json cy.json
          else
            echo "raw results missing, keeping the numbers already in site/assets/js/lab.js"
          fi

      # actions/upload-pages-artifact always names its artifact "github-pages"
      # without an overwrite option, so re-running this job leaves a stale
      # artifact from the previous attempt behind and deploy-pages then finds
      # two of them. Package the artifact ourselves, mirroring the tar step
      # from https://github.com/actions/upload-pages-artifact/blob/main/action.yml,
      # so we can pass overwrite: true below and keep re-runs green.
      - name: Archive the site for Pages
        run: |
          tar \
            --dereference --hard-dereference \
            --directory site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload the Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - id: deployment
        uses: actions/deploy-pages@v4