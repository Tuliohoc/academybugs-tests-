name: tests

on:
  push:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the Playwright suite
        run: npm run test:playwright

      - name: Render the Allure report
        if: always()
        run: npm run report:playwright

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-playwright
          path: reports/playwright
          retention-days: 30
          if-no-files-found: warn

  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run the Cypress suite
        run: npm run test:cypress

      - name: Render the Allure report
        if: always()
        run: npm run report:cypress

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-cypress
          path: reports/cypress
          retention-days: 30
          if-no-files-found: warn
